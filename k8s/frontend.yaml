apiVersion: apps/v1
kind: Deployment

metadata:
  name: fenrir-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fenrir-frontend

  template:
    metadata:
      labels:
        app: fenrir-frontend

    spec:
      containers:
      - name: fenrir-frontend

        image: fenrir-frontend

        imagePullPolicy: Never

        env:
        - name: BACKEND_URL
          value: http://fenrir-backend:8000

        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service

metadata:
  name: fenrir-frontend

spec:
  type: NodePort

  selector:
    app: fenrir-frontend

  ports:
  - port: 9000
    targetPort: 8000
    nodePort: 30009
