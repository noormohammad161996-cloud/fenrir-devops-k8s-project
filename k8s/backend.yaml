apiVersion: apps/v1
kind: Deployment

metadata:
  name: fenrir-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fenrir-backend

  template:
    metadata:
      labels:
        app: fenrir-backend

    spec:
      containers:
      - name: fenrir-backend

        image: fenrir-backend

        imagePullPolicy: Never

        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service

metadata:
  name: fenrir-backend

spec:
  selector:
    app: fenrir-backend

  ports:
  - port: 8000
    targetPort: 8000